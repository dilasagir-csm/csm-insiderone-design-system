<!-- @dsCard group="Colors" viewport="700x180" name="Primary & Accent" subtitle="Solar (accent) + ink neutrals" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .row{display:flex;height:180px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;color:#fff}
  .lbl{font:var(--text-label);font-family:var(--font-body)}
  .hex{font:var(--text-caption);opacity:.8}
</style>
<div class="row">
  <div class="sw" style="background:var(--color-solar)"><div class="lbl">Solar</div><div class="hex">#F4482B</div></div>
  <div class="sw" style="background:var(--color-celestial);color:var(--color-eclipse)"><div class="lbl">Celestial</div><div class="hex">#50E9C3</div></div>
  <div class="sw" style="background:var(--color-dark-matter)"><div class="lbl">Dark Matter</div><div class="hex">#18181B</div></div>
  <div class="sw" style="background:var(--color-eclipse)"><div class="lbl">Eclipse</div><div class="hex">#261A28</div></div>
</div>
