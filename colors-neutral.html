<!-- @dsCard group="Colors" viewport="700x180" name="Neutral Palette" subtitle="Nova, Lunar, Stardust, Cosmic" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .row{display:flex;height:180px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;color:var(--color-eclipse)}
  .lbl{font:var(--text-label);font-family:var(--font-body)}
  .hex{font:var(--text-caption);opacity:.7}
</style>
<div class="row">
  <div class="sw" style="background:var(--color-nova)"><div class="lbl">Nova</div><div class="hex">#EFEBE4</div></div>
  <div class="sw" style="background:var(--color-lunar)"><div class="lbl">Lunar</div><div class="hex">#D0C2C7</div></div>
  <div class="sw" style="background:var(--color-stardust)"><div class="lbl">Stardust</div><div class="hex">#CFEBDD</div></div>
  <div class="sw" style="background:var(--color-cosmic)"><div class="lbl">Cosmic</div><div class="hex">#F0CABF</div></div>
</div>
