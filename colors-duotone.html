<div class="row">
  <div class="sw" style="background:var(--color-orbit)"><div class="lbl">Orbit</div><div class="hex">#23423D</div></div>
  <div class="sw" style="background:var(--color-stratos)"><div class="lbl">Stratos</div><div class="hex">#44221E</div></div>
