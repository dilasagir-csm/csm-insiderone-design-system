<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script>window.__DS_BASE__ = '../..';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
<div id="root"></div>
<script type="text/babel">
  const { LogoLockup, ChannelChip } = window.InsiderOneDesignSystem_c84076;
  const channels = [
    ['web','Web'], ['email','Email'], ['sms','SMS'], ['whatsapp','WhatsApp'],
    ['app','App'], ['push','Push'], ['tiktok','TikTok'], ['ai','Conversational AI'],
  ];
  function Demo() {
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div style={{fontFamily:'var(--font-body)'}}>
        <div style={{display:'flex'}}>
          <div style={{flex:1,background:'var(--surface-page)',padding:24,display:'flex',alignItems:'center'}}>
            <LogoLockup variant="light" logoHeight={28} />
          </div>
          <div style={{flex:1,background:'var(--color-eclipse)',padding:24,display:'flex',alignItems:'center'}}>
            <LogoLockup variant="dark" logoHeight={44} />
          </div>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:10,padding:20,background:'#fff'}}>
          {channels.map(([c,l]) => <ChannelChip key={c} channel={c} label={l} />)}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
