<!-- @dsCard group="Colors" viewport="700x220" name="Brand Gradients" subtitle="Each solid ships as a matching diagonal gradient" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;box-sizing:border-box}
  .sw{height:95px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .lbl{font:600 12px var(--font-body);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}
</style>
<div class="grid">
  <div class="sw" style="background:var(--gradient-solar)"><div class="lbl">Solar</div></div>
  <div class="sw" style="background:var(--gradient-celestial)"><div class="lbl">Celestial</div></div>
  <div class="sw" style="background:var(--gradient-eclipse)"><div class="lbl">Eclipse</div></div>
  <div class="sw" style="background:var(--gradient-orbit)"><div class="lbl">Orbit</div></div>
  <div class="sw" style="background:var(--gradient-stratos)"><div class="lbl">Stratos</div></div>
  <div class="sw" style="background:var(--gradient-cosmic)"><div class="lbl" style="color:var(--color-eclipse);text-shadow:none">Cosmic</div></div>
  <div class="sw" style="background:var(--gradient-stardust)"><div class="lbl" style="color:var(--color-eclipse);text-shadow:none">Stardust</div></div>
  <div class="sw" style="background:var(--gradient-lunar)"><div class="lbl" style="color:var(--color-eclipse);text-shadow:none">Lunar</div></div>
</div>
