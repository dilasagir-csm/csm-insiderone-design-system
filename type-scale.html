<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:16px 20px;box-sizing:border-box}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--border-subtle);padding:6px 0}
  .row:last-child{border-bottom:none}
  .name{width:110px;flex-shrink:0;font:var(--text-caption);color:var(--text-muted)}
  .sample{color:var(--text-primary)}
</style>
<div class="row"><div class="name">display-lg</div><div class="sample" style="font:var(--text-display-lg)">Aa Insider</div></div>
<div class="row"><div class="name">display-sm</div><div class="sample" style="font:var(--text-display-sm)">Aa Insider</div></div>
<div class="row"><div class="name">body-lg</div><div class="sample" style="font:var(--text-body-lg)">Aa Insider One</div></div>
<div class="row"><div class="name">body-sm</div><div class="sample" style="font:var(--text-body-sm)">Aa Insider One</div></div>
<div class="row"><div class="name">label</div><div class="sample" style="font:var(--text-label);text-transform:uppercase;letter-spacing:var(--tracking-caps)">Label text</div></div>
