<!-- @dsCard group="Colors" viewport="700x160" name="Semantic Surfaces" subtitle="Page, card, sunken, inverse" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .row{display:flex;height:160px}
  .sw{flex:1;display:flex;align-items:center;justify-content:center;font:var(--text-label);font-family:var(--font-body)}
</style>
<div class="row">
  <div class="sw" style="background:var(--surface-page);color:var(--text-primary)">page</div>
  <div class="sw" style="background:var(--surface-card);color:var(--text-primary);border-right:1px solid var(--border-subtle)">card</div>
  <div class="sw" style="background:var(--surface-sunken);color:var(--text-primary)">sunken</div>
  <div class="sw" style="background:var(--surface-inverse);color:var(--text-inverse)">inverse</div>
  <div class="sw" style="background:var(--surface-inverse-alt);color:var(--text-inverse)">inverse-alt</div>
</div>
