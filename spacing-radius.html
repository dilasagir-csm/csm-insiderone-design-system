<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:16px;box-sizing:border-box;display:flex;gap:14px;align-items:flex-end}
  .box{background:var(--color-stardust);height:110px;flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box}
  .lbl{font:var(--text-caption);color:var(--color-orbit)}
</style>
<div class="box" style="border-radius:var(--radius-sm)"><div class="lbl">sm 8</div></div>
<div class="box" style="border-radius:var(--radius-md)"><div class="lbl">md 12</div></div>
<div class="box" style="border-radius:var(--radius-lg)"><div class="lbl">lg 20</div></div>
<div class="box" style="border-radius:var(--radius-xl)"><div class="lbl">xl 28</div></div>
<div class="box" style="border-radius:var(--radius-pill)"><div class="lbl">pill</div></div>
